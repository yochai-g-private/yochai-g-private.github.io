<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunset Time Example</title>
</head>
<body>

<script>
//var sunsetTime;
//var sunriseTime;

// Function to get the sunset time using the Sunrise Sunset API
function getSunsetTime() {
  const apiUrl = `https://api.sunrise-sunset.org/json?lat=31.424836&lng=35.182815&formatted=0&tzid=UTC`;

  // Fetch the sunset data
  fetch(apiUrl)
    .then(response => response.json())
    .then(data => {
		sunset = new Date(data.results.sunset);
		sunrise = new Date(data.results.sunrise);
		now = new Date();
		now.setHours(2, 0, 0);
		is_night = now >= sunset || now < sunrise;
		
		console.log('Sunrise time:', sunrise.toLocaleTimeString());
		console.log('Sunset time:',  sunset.toLocaleTimeString());
		console.log('NOW:', now.toLocaleTimeString());
		console.log('Is night:', is_night);
		
		
    })
    .catch(error => {
      console.error('Error fetching sunset time:', error);
    });
}

// Call the function to get the sunset time
getSunsetTime();
</script>

</body>
</html>
